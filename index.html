<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>circularnodes p0.1</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f2f2f2;
        color: #444;
        font: 13px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif;
      }
      canvas {
        background: #fff;
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.15);
        touch-action: none;
        cursor: crosshair;
      }
      .help {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 90vw;
      }
      .help kbd {
        display: inline-block;
        min-width: 1em;
        padding: 1px 5px;
        border: 1px solid #c4c4c4;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #fff;
        font: inherit;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div class="help">
      <span>ドラッグ: 塗る / 塗り済みから開始で消す</span>
      <span><kbd>G</kbd> ガイド表示</span>
      <span><kbd>P</kbd> PNG 書き出し</span>
      <span><kbd>S</kbd> SVG 書き出し</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
