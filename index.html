<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>circularnodes p0.1</title>
    <style>
      :root {
        color-scheme: light;
        --menubar-height: 28px;
        --statusbar-height: 30px;
        --menu-bg: #fdfdfd;
        --menu-border: #d8d8d8;
        --menu-text: #1c1c1c;
        --menu-dim: #8a8a8a;
        --menu-hover: #e8e8e8;
        --menu-accent: #3478f6;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: #f2f2f2;
        color: #444;
        font: 13px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif;
      }
      /* メニューバーとステータスバーの間。収まらないときはここがスクロールする */
      .stage {
        position: fixed;
        inset: var(--menubar-height) 0 var(--statusbar-height) 0;
        display: flex;
        overflow: auto;
      }
      /* justify-content ではなく margin で中央に置く。
         内容がステージより大きいときに端が切れないようにするため */
      .stage canvas {
        margin: auto;
        background: #fff;
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.15);
        touch-action: none;
        cursor: crosshair;
      }
      /* Space を押している間はパン（F-11） */
      .stage.is-pan-ready,
      .stage.is-pan-ready canvas {
        cursor: grab;
      }
      .stage.is-panning,
      .stage.is-panning canvas {
        cursor: grabbing;
      }
      .stage.is-pan-ready {
        user-select: none;
      }

      /* --- ステータスバー (F-10) --- */
      .statusbar {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        height: var(--statusbar-height);
        padding: 0 10px;
        background: var(--menu-bg);
        border-top: 1px solid var(--menu-border);
        user-select: none;
      }
      .statusbar__hint {
        overflow: hidden;
        color: #777;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .zoom {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        gap: 4px;
      }
      .zoom__button {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 1px solid #c4c4c4;
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: default;
      }
      .zoom__button:hover:not(:disabled) {
        background: #f0f0f0;
      }
      .zoom__button:disabled {
        color: #bbb;
        border-color: #e0e0e0;
      }
      .zoom__value {
        min-width: 44px;
        color: var(--menu-text);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* --- メニューバー (F-09) --- */
      .menubar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 100;
        display: flex;
        align-items: stretch;
        height: var(--menubar-height);
        padding-left: 6px;
        background: var(--menu-bg);
        border-bottom: 1px solid var(--menu-border);
        color: var(--menu-text);
        user-select: none;
      }
      .menu {
        position: relative;
      }
      .menu__title {
        height: 100%;
        padding: 0 11px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .menu__title:hover {
        background: var(--menu-hover);
      }
      .menu.is-open > .menu__title {
        background: var(--menu-accent);
        color: #fff;
      }

      .menu__list {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 1;
        min-width: 210px;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        background: var(--menu-bg);
        border: 1px solid var(--menu-border);
        border-radius: 6px;
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.16);
      }
      .menu.is-open > .menu__list {
        display: block;
      }

      .item-row {
        position: relative;
      }
      /* 下位メニューは親項目のホバーで開く */
      .menu__list--sub {
        top: -5px;
        left: 100%;
      }
      .item-row--parent:hover > .menu__list--sub {
        display: block;
      }

      .item {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 4px 12px 4px 8px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        white-space: nowrap;
        cursor: default;
      }
      .item:hover {
        background: var(--menu-accent);
        color: #fff;
      }
      .item__check::before {
        content: "✓";
        visibility: hidden;
      }
      .item.is-checked .item__check::before {
        visibility: visible;
      }
      /* ショートカットは右詰め・薄く */
      .item__shortcut {
        justify-self: end;
        color: var(--menu-dim);
        font-variant-numeric: tabular-nums;
      }
      .item:hover .item__shortcut {
        color: rgb(255 255 255 / 0.75);
      }
      .item__arrow {
        justify-self: end;
        color: var(--menu-dim);
      }
      .item:hover .item__arrow {
        color: #fff;
      }
      .item__shortcut:empty {
        min-width: 0;
      }

      /* --- ダイアログ (F-04) --- */
      .dialog {
        min-width: 300px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: #fdfdfd;
        color: #1c1c1c;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.24);
      }
      .dialog::backdrop {
        background: rgb(0 0 0 / 0.25);
      }
      .dialog__form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
      }
      .dialog__title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .dialog__row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .dialog__field {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dialog__field input {
        width: 72px;
        padding: 5px 8px;
        border: 1px solid #c4c4c4;
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      .dialog__field input:focus-visible {
        outline: 2px solid var(--menu-accent);
        outline-offset: -1px;
      }
      .dialog__times {
        padding-bottom: 5px;
        color: #8a8a8a;
      }
      .dialog__hint {
        margin: 0;
        color: #8a8a8a;
        font-size: 12px;
      }
      .dialog__hint.is-invalid {
        color: #c0392b;
      }
      .dialog__warning {
        margin: 0;
        padding: 6px 9px;
        border-radius: 5px;
        background: #fdf3e2;
        color: #8a5a10;
        font-size: 12px;
      }
      .dialog__buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 4px;
      }
      .dialog__buttons button {
        padding: 6px 14px;
        border: 1px solid #c4c4c4;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: default;
      }
      .dialog__buttons button:hover {
        background: #f0f0f0;
      }
      .dialog__buttons .is-primary {
        border-color: transparent;
        background: var(--menu-accent);
        color: #fff;
      }
      .dialog__buttons .is-primary:hover {
        background: #2a68dd;
      }
      .dialog__buttons .is-primary:disabled {
        background: #b9cdf5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
